openapi: 3.1.0
info:
  title: Creator Marketplace API
  version: 0.3.0
  description: |
    Contract v0.3 (Phase 0, Week 3): authentication, `/me`, public creator search and profile, the creator workspace (profile, socials, packages, portfolio, vetting, stats), brand profile, uploads and payout onboarding.
    This file is the single source of truth between the React app and the Spring Boot API.
    Frontend types are generated from it with `npm run gen:api` (openapi-typescript).

    Conventions
    - All money is integer minor units (cents) plus an ISO 4217 currency. Never floating point.
    - Errors are RFC 7807 `application/problem+json` (`Problem`). Field errors use status 422.
    - Lists accept `?page=&size=&sort=` and return `content` plus `PageMeta`.
    - Money-moving endpoints accept an `Idempotency-Key` header.
    - IDs in the API are 26-character ULIDs (`public_id`), never database IDs.
    - The access token (15 min) is sent as `Authorization: Bearer`. The refresh token (7 days, rotated on
      every use) lives only in an httpOnly, Secure, SameSite=Strict cookie on `/api/v1/auth`.

    Mock-only endpoints (Phase 0, never in production, not in this contract): `GET /dev/outbox`,
    `POST /dev/reset`, `POST /dev/simulate-time`.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Creators
  - name: Creator workspace
  - name: Brand workspace
  - name: Files
  - name: Payouts

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Sign up with email and password, choosing Brand or Creator (FR-01)
      description: Creates the account, sends a verification email (FR-02) and signs the user in. The new account is unverified.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh-token cookie for a new access token (FR-04)
      description: |
        The refresh token is rotated: the old one is revoked and a new cookie is set.
        Presenting an already-revoked refresh token revokes every session of that user (reuse detection).
      operationId: refresh
      responses:
        '200':
          description: New session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token and clear the cookie
      operationId: logout
      responses:
        '204': { description: Signed out. }

  /auth/oauth/google:
    post:
      tags: [Auth]
      summary: Sign in or sign up with Google (FR-01)
      description: |
        Verifies the Google ID token. An existing account is signed in. A new account needs `role`;
        without it the call fails with 422 and `errors[0].field = "role"`. Google emails count as verified.
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with the token from the verification email (FR-02)
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Email verified. Returns the updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Send a new verification email to the signed-in user
      description: Invalidates earlier verification links. Limited to 5 per hour.
      operationId: resendVerification
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Email queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password-reset link valid for 30 minutes (FR-03)
      description: Always answers 202, whether or not the email has an account, so the endpoint cannot be used to find accounts.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: If the account exists, an email was sent. }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token (FR-03)
      description: The token is single-use and expires 30 minutes after it was issued. Success revokes every session of the user.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password changed. Sign in with the new password. }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me:
    get:
      tags: [Users]
      summary: The signed-in user
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update the signed-in user's own fields
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators:
    get:
      tags: [Creators]
      summary: Search approved creators (FR-20 – FR-24)
      description: |
        Public. Only creators with vetting status APPROVED are returned. All filters combine with AND.
        When `platform` is given, follower and price filters, the card's `reach` and `startingPriceCents`
        all refer to that platform; otherwise to the creator's largest platform and cheapest active package.
        Target p95 under 500 ms.
      operationId: searchCreators
      parameters:
        - { name: q, in: query, description: 'Keywords; every word must match the name, username, bio or a niche (FR-20).', schema: { type: string, maxLength: 100 } }
        - { name: platform, in: query, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: niche, in: query, schema: { $ref: '#/components/schemas/Niche' } }
        - { name: country, in: query, description: ISO 3166-1 alpha-2., schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: followersMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: followersMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: priceMinCents, in: query, description: Starting price at least this., schema: { type: integer, minimum: 0 } }
        - { name: priceMaxCents, in: query, description: Starting price at most this., schema: { type: integer, minimum: 0 } }
        - { name: language, in: query, description: ISO 639-1., schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: gender, in: query, schema: { $ref: '#/components/schemas/Gender' } }
        - { name: ageMin, in: query, schema: { type: integer, minimum: 13, maximum: 100 } }
        - { name: ageMax, in: query, schema: { type: integer, minimum: 13, maximum: 100 } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, followers_desc, rating_desc, newest], default: relevance }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, description: 'FR-23: 24 per page.', schema: { type: integer, minimum: 1, maximum: 24, default: 24 } }
      responses:
        '200':
          description: One page of creator cards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorSearchPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me:
    get:
      tags: [Creator workspace]
      summary: The signed-in creator's own profile, including private and draft fields
      operationId: getMyCreatorProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The profile., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creators/me/profile:
    put:
      tags: [Creator workspace]
      summary: Save profile details (FR-10)
      description: |
        Replaces the editable profile fields. The username can change only until the profile is first approved
        (409 USERNAME_LOCKED afterwards), must be unique (409 USERNAME_TAKEN) and not reserved (422).
      operationId: updateMyCreatorProfile
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatorProfileInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/social-accounts:
    post:
      tags: [Creator workspace]
      summary: Link a social account (FR-11)
      description: One account per platform (409 PLATFORM_EXISTS). New accounts are unverified until our team checks them.
      operationId: addMySocialAccount
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccountInput' } } } }
      responses:
        '201': { description: Linked., content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccount' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/social-accounts/{id}:
    delete:
      tags: [Creator workspace]
      summary: Remove a linked social account
      operationId: removeMySocialAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/packages:
    post:
      tags: [Creator workspace]
      summary: Create a package (FR-12, FR-13)
      description: Price at least 1000 cents ($10), delivery 1–60 days, at most 8 active packages (409 PACKAGE_LIMIT).
      operationId: createMyPackage
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/OwnPackage' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/packages/{id}:
    patch:
      tags: [Creator workspace]
      summary: Edit a package, or switch it on or off
      description: Switching a package on counts toward the limit of 8 active packages. Prices of existing orders never change.
      operationId: updateMyPackage
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackagePatch' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/OwnPackage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Creator workspace]
      summary: Delete a package
      operationId: deleteMyPackage
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/portfolio:
    post:
      tags: [Creator workspace]
      summary: Add a portfolio image or video link (FR-14)
      description: At most 12 items (409 PORTFOLIO_LIMIT). Image URLs come from `POST /files/presign`.
      operationId: addMyPortfolioItem
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioItemInput' } } } }
      responses:
        '201': { description: Added., content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioItem' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/portfolio/{id}:
    delete:
      tags: [Creator workspace]
      summary: Remove a portfolio item
      operationId: removeMyPortfolioItem
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/submit-for-review:
    post:
      tags: [Creator workspace]
      summary: Send the profile to our team for vetting (FR-16)
      description: |
        DRAFT or REJECTED → PENDING_REVIEW. Needs a complete profile with photo, at least one social account,
        one active package and payouts set up; otherwise 422 with one error per missing item
        (`field` = profile | photo | socials | packages | payouts). Any other status → 409.
      operationId: submitMyProfileForReview
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Submitted., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/stats:
    get:
      tags: [Creator workspace]
      summary: Dashboard numbers (FR-70)
      operationId: getMyCreatorStats
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stats., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorStats' } } } }

  /brands/me/profile:
    get:
      tags: [Brand workspace]
      summary: The signed-in brand's company profile (FR-05)
      operationId: getMyBrandProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The profile., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Brand workspace]
      summary: Save the company profile (FR-05)
      operationId: updateMyBrandProfile
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfileInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /files/presign:
    post:
      tags: [Files]
      summary: Get a pre-signed URL to upload an image straight to storage
      description: |
        The browser PUTs the file to `uploadUrl` with `headers`, then saves `fileUrl` on the profile.
        Images only (JPEG, PNG, WebP), at most 10 MB. Videos are added as links, not uploads.
      operationId: presignUpload
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PresignRequest' } } } }
      responses:
        '200': { description: Upload target., content: { application/json: { schema: { $ref: '#/components/schemas/PresignResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payouts/onboarding-link:
    post:
      tags: [Payouts]
      summary: Start or continue Stripe Connect Express onboarding (FR-62)
      description: |
        Creates the connected account on first use and returns a one-time Stripe-hosted onboarding URL.
        Stripe sends the creator back to `returnUrl`; the payout status changes when Stripe's
        `account.updated` webhook arrives.
      operationId: createPayoutOnboardingLink
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingLinkRequest' } } } }
      responses:
        '200': { description: The link., content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingLink' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creators/{username}:
    get:
      tags: [Creators]
      summary: Public creator profile (FR-15)
      description: |
        Public, no login needed. 404 unless the creator is APPROVED — except that the creator themself and
        admins can preview an unapproved profile (then `vettingStatus` tells them it is not live).
        Each view by someone other than the creator counts toward profile views (FR-70).
      operationId: getCreatorProfile
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Not signed in, the token expired, or the credentials are wrong.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not allowed (wrong role, not the owner, account suspended, email not verified).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or the caller may not know it exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with the current state (duplicate email, invalid order transition).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: One or more fields are invalid. See `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- Shared ----------
    Money:
      type: object
      description: An amount in integer minor units (cents for USD).
      required: [amountCents, currency]
      properties:
        amountCents: { type: integer, format: int64, examples: [22000] }
        currency: { type: string, minLength: 3, maxLength: 3, examples: [USD] }

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [status, title]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string, examples: [Validation failed] }
        status: { type: integer, examples: [422] }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable reason, e.g. EMAIL_TAKEN, EMAIL_NOT_VERIFIED, INVALID_TRANSITION, TOKEN_EXPIRED.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [email] }
        message: { type: string, examples: [This email already has an account.] }

    PageMeta:
      type: object
      description: Paging fields returned next to `content` by every list endpoint.
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0, description: Zero-based page number. }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    # ---------- Users ----------
    Role:
      type: string
      enum: [BRAND, CREATOR, ADMIN]

    SignupRole:
      type: string
      description: Roles a person can choose at sign-up. ADMIN accounts are created by staff only.
      enum: [BRAND, CREATOR]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, BANNED]

    VettingStatus:
      type: string
      description: Creator profile vetting (FR-16). Only APPROVED profiles appear in search.
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED]

    CreatorSummary:
      type: object
      required: [username, vettingStatus]
      properties:
        username: { type: [string, 'null'], description: Chosen during onboarding; null until then. }
        vettingStatus: { $ref: '#/components/schemas/VettingStatus' }
        rejectionReason: { type: [string, 'null'] }

    BrandSummary:
      type: object
      required: [companyName]
      properties:
        companyName: { type: [string, 'null'] }

    Me:
      type: object
      required: [id, email, name, role, status, emailVerified, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified:
          type: boolean
          description: Placing or accepting orders needs a verified email (FR-02).
        createdAt: { type: string, format: date-time }
        creator: { $ref: '#/components/schemas/CreatorSummary' }
        brand: { $ref: '#/components/schemas/BrandSummary' }

    UpdateMeRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }

    # ---------- Creators ----------
    Platform:
      type: string
      enum: [INSTAGRAM, TIKTOK, YOUTUBE, UGC]

    Niche:
      type: string
      enum: [BEAUTY, FASHION, FITNESS, FOOD, TRAVEL, TECH, GAMING, LIFESTYLE, PARENTING, FINANCE, HOME, PETS, MUSIC, EDUCATION, COMEDY, WELLNESS, SUSTAINABILITY, AUTOMOTIVE]

    Gender:
      type: string
      enum: [FEMALE, MALE, NON_BINARY]

    PlatformReach:
      type: object
      required: [platform, handle, followers]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, examples: [leomakes] }
        followers: { type: integer, format: int64 }

    CreatorCard:
      type: object
      description: Search result card (FR-24).
      required: [username, displayName, photoUrl, city, country, niches, reach, startingPriceCents, currency, ratingAvg, ratingCount, verified]
      properties:
        username: { type: string }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'], description: ISO 3166-1 alpha-2. }
        niches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Niche' }
        reach:
          description: The filtered platform's account, or else the creator's largest. Null if no socials.
          oneOf:
            - $ref: '#/components/schemas/PlatformReach'
            - type: 'null'
        startingPriceCents:
          type: [integer, 'null']
          format: int64
          description: Cheapest active package (on the filtered platform, if any). Null if none.
        currency: { type: string, examples: [USD] }
        ratingAvg:
          type: [number, 'null']
          description: Average of review ratings, one decimal. Null when there are no reviews.
          examples: [4.8]
        ratingCount: { type: integer }
        verified:
          type: boolean
          description: At least one social account was verified by our team (badge).

    CreatorSearchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CreatorCard' }

    SocialAccount:
      type: object
      required: [id, platform, handle, url, followers, engagementRateBps, verified]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string }
        url: { type: [string, 'null'], format: uri }
        followers: { type: integer, format: int64 }
        engagementRateBps:
          type: [integer, 'null']
          description: Engagement rate in basis points, e.g. 345 = 3.45 %.
        verified: { type: boolean }

    Package:
      type: object
      description: A priced offer (FR-12). Price is integer cents, minimum 1000.
      required: [id, platform, title, description, deliverables, priceCents, currency, deliveryDays]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        deliverables:
          type: array
          items: { type: string, maxLength: 120 }
        priceCents: { type: integer, format: int64, minimum: 1000 }
        currency: { type: string, examples: [USD] }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }

    PortfolioItem:
      type: object
      required: [id, type, url, caption]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { type: string, enum: [IMAGE, VIDEO_LINK] }
        url: { type: string, format: uri-reference }
        caption: { type: [string, 'null'], maxLength: 140 }

    Review:
      type: object
      required: [id, rating, comment, brandName, createdAt, creatorReply, repliedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        brandName: { type: string }
        createdAt: { type: string, format: date-time }
        creatorReply: { type: [string, 'null'] }
        repliedAt: { type: [string, 'null'], format: date-time }

    CreatorProfile:
      allOf:
        - $ref: '#/components/schemas/CreatorCard'
        - type: object
          required: [bio, languages, coverUrls, socials, packages, portfolio, reviews, memberSince, vettingStatus]
          properties:
            bio: { type: [string, 'null'] }
            languages:
              type: array
              items: { type: string, description: ISO 639-1. }
            coverUrls:
              type: array
              maxItems: 3
              items: { type: string, format: uri-reference }
            socials:
              type: array
              items: { $ref: '#/components/schemas/SocialAccount' }
            packages:
              type: array
              description: Active packages only, cheapest first.
              items: { $ref: '#/components/schemas/Package' }
            portfolio:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/PortfolioItem' }
            reviews:
              type: array
              description: Latest 20 reviews; `ratingCount` has the total.
              items: { $ref: '#/components/schemas/Review' }
            memberSince: { type: string, format: date-time }
            vettingStatus:
              $ref: '#/components/schemas/VettingStatus'
              description: Always APPROVED for the public; other values only in an owner or admin preview.

    # ---------- Creator workspace (Week 3) ----------
    CreatorProfileInput:
      type: object
      required: [username, displayName, bio, city, country, languages, niches]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z][a-z0-9._]{2,29}$' }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        bio: { type: string, minLength: 30, maxLength: 1000 }
        city: { type: string, minLength: 2, maxLength: 80 }
        country: { type: string, minLength: 2, maxLength: 2 }
        gender:
          oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }]
          description: Optional. Used only as a search filter, never shown on the profile.
        birthYear: { type: [integer, 'null'], description: 'Optional, age 16–90. Search filter only, never shown.' }
        languages: { type: array, minItems: 1, maxItems: 5, items: { type: string, minLength: 2, maxLength: 2 } }
        niches: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { $ref: '#/components/schemas/Niche' } }
        photoUrl: { type: [string, 'null'] }
        coverUrls: { type: array, maxItems: 3, items: { type: string } }

    SocialAccountInput:
      type: object
      required: [platform, handle, followers]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, minLength: 2, maxLength: 40, pattern: '^[A-Za-z0-9._]+$', description: Without the @. }
        followers: { type: integer, minimum: 0, maximum: 1000000000 }

    PackageInput:
      type: object
      required: [platform, title, description, deliverables, priceCents, deliveryDays]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }
        active: { type: boolean, default: true }

    PackagePatch:
      type: object
      description: Any subset of PackageInput fields.
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }
        active: { type: boolean }

    OwnPackage:
      allOf:
        - $ref: '#/components/schemas/Package'
        - type: object
          required: [active]
          properties:
            active: { type: boolean }

    PortfolioItemInput:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [IMAGE, VIDEO_LINK] }
        url: { type: string, maxLength: 2000000, description: 'IMAGE: a fileUrl from /files/presign. VIDEO_LINK: an https URL.' }
        caption: { type: [string, 'null'], maxLength: 140 }

    PayoutStatus:
      type: string
      description: NOT_STARTED → PENDING (details submitted, Stripe checking) → ENABLED.
      enum: [NOT_STARTED, PENDING, ENABLED]

    CreatorChecklist:
      type: object
      description: What is still needed before the profile can be submitted. Portfolio is recommended, not required.
      required: [profile, photo, socials, packages, portfolio, payouts]
      properties:
        profile: { type: boolean }
        photo: { type: boolean }
        socials: { type: boolean }
        packages: { type: boolean }
        portfolio: { type: boolean }
        payouts: { type: boolean }

    CreatorMe:
      type: object
      required: [username, displayName, bio, city, country, gender, birthYear, languages, niches, photoUrl, coverUrls, vettingStatus, rejectionReason, submittedAt, socials, packages, portfolio, payoutStatus, checklist, usernameLocked]
      properties:
        username: { type: [string, 'null'] }
        displayName: { type: string }
        bio: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        birthYear: { type: [integer, 'null'] }
        languages: { type: array, items: { type: string } }
        niches: { type: array, items: { $ref: '#/components/schemas/Niche' } }
        photoUrl: { type: [string, 'null'] }
        coverUrls: { type: array, items: { type: string } }
        vettingStatus: { $ref: '#/components/schemas/VettingStatus' }
        rejectionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        socials: { type: array, items: { $ref: '#/components/schemas/SocialAccount' } }
        packages: { type: array, description: Active and inactive., items: { $ref: '#/components/schemas/OwnPackage' } }
        portfolio: { type: array, items: { $ref: '#/components/schemas/PortfolioItem' } }
        payoutStatus: { $ref: '#/components/schemas/PayoutStatus' }
        checklist: { $ref: '#/components/schemas/CreatorChecklist' }
        usernameLocked: { type: boolean, description: True once the profile has been approved. }

    CreatorStats:
      type: object
      required: [currency, availableCents, inEscrowCents, lifetimeEarnedCents, ordersByStatus, profileViews, activePackages]
      properties:
        currency: { type: string }
        availableCents: { type: integer, format: int64, description: Creator balance not yet paid out. }
        inEscrowCents: { type: integer, format: int64, description: What the creator will receive for accepted orders not yet approved. }
        lifetimeEarnedCents: { type: integer, format: int64 }
        ordersByStatus:
          type: object
          description: Count per order status; every status is present.
          additionalProperties: { type: integer }
        profileViews: { type: integer }
        activePackages: { type: integer }

    BrandIndustry:
      type: string
      enum: [BEAUTY, FASHION, FOOD, HEALTH, HOME, TECH, TRAVEL, FINANCE, EDUCATION, PETS, AGENCY, OTHER]

    BrandProfile:
      type: object
      required: [companyName, website, logoUrl, industry, country, plan]
      properties:
        companyName: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        industry: { oneOf: [{ $ref: '#/components/schemas/BrandIndustry' }, { type: 'null' }] }
        country: { type: [string, 'null'] }
        plan: { type: string, enum: [FREE], description: Pro / Premium arrive in v2. }

    BrandProfileInput:
      type: object
      required: [companyName, industry, country]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 100 }
        website: { type: [string, 'null'], maxLength: 200, description: 'https://… (http:// accepted and upgraded).' }
        logoUrl: { type: [string, 'null'] }
        industry: { $ref: '#/components/schemas/BrandIndustry' }
        country: { type: string, minLength: 2, maxLength: 2 }

    PresignRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      properties:
        purpose: { type: string, enum: [AVATAR, COVER, PORTFOLIO, BRAND_LOGO] }
        fileName: { type: string, maxLength: 200 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }

    PresignResponse:
      type: object
      required: [uploadUrl, method, headers, fileUrl, expiresAt]
      properties:
        uploadUrl: { type: string }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        fileUrl: { type: string, description: Where the file will be served from once uploaded. }
        expiresAt: { type: string, format: date-time }

    OnboardingLinkRequest:
      type: object
      required: [returnUrl]
      properties:
        returnUrl: { type: string, description: App path Stripe sends the creator back to, e.g. /creator/onboarding?step=payouts. }

    OnboardingLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }

    # ---------- Auth ----------
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT, valid 15 minutes. }
        expiresIn: { type: integer, description: Seconds until the access token expires., examples: [900] }
        user: { $ref: '#/components/schemas/Me' }

    RegisterRequest:
      type: object
      required: [role, name, email, password, acceptTerms]
      properties:
        role: { $ref: '#/components/schemas/SignupRole' }
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least 8 characters with a letter and a number.
        acceptTerms: { type: boolean, const: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    GoogleAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, description: Google ID token from Google Identity Services. }
        role:
          $ref: '#/components/schemas/SignupRole'
          description: Required only when no account exists yet for this Google email.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
