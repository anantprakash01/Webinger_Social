openapi: 3.1.0
info:
  title: Creator Marketplace API
  version: 3.3.0
  description: |
    **Contract v2.0 — India market (INR, Razorpay), 22 Nov 2026.** v1.0 was frozen at the end of Phase 0; v1.1 added fields (UX pass); v2.0 replaces Stripe with Razorpay and adds payment sessions, saved payment methods, payout accounts and withdrawals. The Spring Boot API (Phase 1) implements
    exactly this contract. Changes after the freeze need a reviewed PR that bumps the version (minor for
    additive changes, major for breaking ones) and regenerates the frontend types; CI runs `npm run check:contract`.

    Covers: admin, reports, payouts, audit; campaigns, chat, notifications, brand stats; orders, checkout quote, reviews; plus authentication, `/me`, public creator search and profile, the creator workspace (profile, socials, packages, portfolio, vetting, stats), brand profile, uploads and payout onboarding.
    This file is the single source of truth between the React app and the Spring Boot API.
    Frontend types are generated from it with `npm run gen:api` (openapi-typescript).

    Conventions
    - All money is integer minor units plus an ISO 4217 currency (INR: paise; fields keep the `Cents` suffix). Never floating point.
    - Errors are RFC 7807 `application/problem+json` (`Problem`). Field errors use status 422.
    - Lists accept `?page=&size=&sort=` and return `content` plus `PageMeta`.
    - Money-moving endpoints accept an `Idempotency-Key` header.
    - IDs in the API are 26-character ULIDs (`public_id`), never database IDs.
    - The access token (15 min) is sent as `Authorization: Bearer`. The refresh token (7 days, rotated on
      every use) lives only in an httpOnly, Secure, SameSite=Strict cookie on `/api/v1/auth`.

    Mock-only endpoints (Phase 0, never in production, not in this contract): `/dev/*` — demo outbox, reset,
    simulate time and clock, a stand-in for Razorpay Checkout (`/dev/razorpay/pay`), vetting decision and
    the real-time poller.
servers:
  - url: /api/v1
tags:
  - name: Lists
    description: Saved lists of creators (FR-25, v2.5).
  - name: Auth
  - name: Users
  - name: Creators
  - name: Creator workspace
  - name: Brand workspace
  - name: Files
  - name: Payouts
  - name: Orders
  - name: Reviews
  - name: Campaigns
  - name: Chat
  - name: Notifications
  - name: Admin
  - name: Reports
  - name: Payments

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Sign up with email and password, choosing Brand or Creator (FR-01)
      description: Creates the account, sends a verification email (FR-02) and signs the user in. The new account is unverified.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh-token cookie for a new access token (FR-04)
      description: |
        The refresh token is rotated: the old one is revoked and a new cookie is set.
        Presenting an already-revoked refresh token revokes every session of that user (reuse detection).
      operationId: refresh
      responses:
        '200':
          description: New session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token and clear the cookie
      operationId: logout
      responses:
        '204': { description: Signed out. }

  /auth/oauth/google:
    post:
      tags: [Auth]
      summary: Sign in or sign up with Google (FR-01)
      description: |
        Verifies the Google ID token. An existing account is signed in. A new account needs `role`;
        without it the call fails with 422 and `errors[0].field = "role"`. Google emails count as verified.
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with the token from the verification email (FR-02)
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Email verified. Returns the updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Send a new verification email to the signed-in user
      description: Invalidates earlier verification links. Limited to 5 per hour.
      operationId: resendVerification
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Email queued. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password-reset link valid for 30 minutes (FR-03)
      description: Always answers 202, whether or not the email has an account, so the endpoint cannot be used to find accounts.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: If the account exists, an email was sent. }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token (FR-03)
      description: The token is single-use and expires 30 minutes after it was issued. Success revokes every session of the user.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password changed. Sign in with the new password. }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me:
    get:
      tags: [Users]
      summary: The signed-in user
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update the signed-in user's own fields
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/avatar:
    put:
      tags: [Users]
      summary: Change the picture shown for the signed-in user (v2.1)
      description: |
        Creators: their profile photo (required for review, so it can be replaced but not removed — 422).
        Brands: the company logo (can be removed). Admins: their own avatar. Upload first with
        `POST /files/presign` (purpose AVATAR or BRAND_LOGO) and send the resulting URL.
      operationId: updateMyAvatar
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarUpdate' } } } }
      responses:
        '200': { description: The updated user., content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/password:
    post:
      tags: [Users]
      summary: Change password (v2.2); other devices are signed out
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses:
        '204': { description: Changed. }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/email:
    post:
      tags: [Users]
      summary: Change the sign-in email (v2.2); the new address must be verified again
      operationId: changeEmail
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeEmailRequest' } } } }
      responses:
        '200': { description: The updated user (emailVerified false)., content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/sessions/revoke-others:
    post:
      tags: [Users]
      summary: Sign out every other device (v2.2)
      operationId: signOutOtherDevices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Number of other sessions ended., content: { application/json: { schema: { type: object, required: [signedOut], properties: { signedOut: { type: integer } } } } } }

  /me/export:
    get:
      tags: [Users]
      summary: Download my data (DPDP right of access, v2.2)
      description: Everything held about the user as JSON. Card numbers are never held; bank account numbers are masked.
      operationId: exportMyData
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The export., content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  /me/notification-preferences:
    get:
      tags: [Users]
      summary: Notification channels per category (FR-53, v2.5)
      operationId: getNotificationPreferences
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The preferences., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
    put:
      tags: [Users]
      summary: Save notification channels (FR-53, v2.5)
      description: In-app notifications are always on. SMS and WhatsApp need a verified Indian mobile number; security emails (verification, password reset) are always sent.
      operationId: saveNotificationPreferences
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/deletion:
    post:
      tags: [Users]
      summary: Delete my account (DPDP right to erasure, FR-06, v2.2)
      description: Schedules erasure in 30 days. Refused while orders are open (409 OPEN_ORDERS) or a creator has an available balance (409 BALANCE_REMAINING). Invoices and payment records are kept as tax law requires; the person is anonymised.
      operationId: requestAccountDeletion
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } } }
      responses:
        '200': { description: Scheduled., content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Users]
      summary: Cancel a scheduled account deletion (v2.2)
      operationId: cancelAccountDeletion
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cancelled., content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }

  /creators:
    get:
      tags: [Creators]
      summary: Search approved creators (FR-20 – FR-24)
      description: |
        Public. Only creators with vetting status APPROVED are returned. All filters combine with AND.
        When `platform` is given, follower and price filters, the card's `reach` and `startingPriceCents`
        all refer to that platform; otherwise to the creator's largest platform and cheapest active package.
        Target p95 under 500 ms.
      operationId: searchCreators
      parameters:
        - { name: q, in: query, description: 'Keywords; every word must match the name, username, bio or a niche (FR-20).', schema: { type: string, maxLength: 100 } }
        - { name: platform, in: query, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: niche, in: query, schema: { $ref: '#/components/schemas/Niche' } }
        - { name: country, in: query, description: ISO 3166-1 alpha-2., schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: followersMin, in: query, schema: { type: integer, minimum: 0 } }
        - { name: followersMax, in: query, schema: { type: integer, minimum: 0 } }
        - { name: priceMinCents, in: query, description: Starting price at least this., schema: { type: integer, minimum: 0 } }
        - { name: priceMaxCents, in: query, description: Starting price at most this., schema: { type: integer, minimum: 0 } }
        - { name: language, in: query, description: ISO 639-1., schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: gender, in: query, schema: { $ref: '#/components/schemas/Gender' } }
        - { name: ageMin, in: query, schema: { type: integer, minimum: 13, maximum: 100 } }
        - { name: ageMax, in: query, schema: { type: integer, minimum: 13, maximum: 100 } }
        - { name: fastAccept, in: query, description: 'Only creators who usually accept within 24 hours (v2.6).', schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, followers_desc, rating_desc, newest], default: relevance }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, description: 'FR-23: 24 per page.', schema: { type: integer, minimum: 1, maximum: 24, default: 24 } }
      responses:
        '200':
          description: One page of creator cards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorSearchPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me:
    get:
      tags: [Creator workspace]
      summary: The signed-in creator's own profile, including private and draft fields
      operationId: getMyCreatorProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The profile., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creators/me/profile:
    put:
      tags: [Creator workspace]
      summary: Save profile details (FR-10)
      description: |
        Replaces the editable profile fields. The username can change only until the profile is first approved
        (409 USERNAME_LOCKED afterwards), must be unique (409 USERNAME_TAKEN) and not reserved (422).
      operationId: updateMyCreatorProfile
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatorProfileInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/social-accounts:
    post:
      tags: [Creator workspace]
      summary: Link a social account (FR-11)
      description: One account per platform (409 PLATFORM_EXISTS). New accounts are unverified until our team checks them.
      operationId: addMySocialAccount
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccountInput' } } } }
      responses:
        '201': { description: Linked., content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccount' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/social-accounts/{id}:
    delete:
      tags: [Creator workspace]
      summary: Remove a linked social account
      operationId: removeMySocialAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/packages:
    post:
      tags: [Creator workspace]
      summary: Create a package (FR-12, FR-13)
      description: Price at least 1000 cents ($10), delivery 1–60 days, at most 8 active packages (409 PACKAGE_LIMIT).
      operationId: createMyPackage
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/OwnPackage' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/packages/{id}:
    patch:
      tags: [Creator workspace]
      summary: Edit a package, or switch it on or off
      description: Switching a package on counts toward the limit of 8 active packages. Prices of existing orders never change.
      operationId: updateMyPackage
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackagePatch' } } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/OwnPackage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Creator workspace]
      summary: Delete a package
      operationId: deleteMyPackage
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/portfolio:
    post:
      tags: [Creator workspace]
      summary: Add a portfolio image or video link (FR-14)
      description: At most 12 items (409 PORTFOLIO_LIMIT). Image URLs come from `POST /files/presign`.
      operationId: addMyPortfolioItem
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioItemInput' } } } }
      responses:
        '201': { description: Added., content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioItem' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/portfolio/{id}:
    delete:
      tags: [Creator workspace]
      summary: Remove a portfolio item
      operationId: removeMyPortfolioItem
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/submit-for-review:
    post:
      tags: [Creator workspace]
      summary: Send the profile to our team for vetting (FR-16)
      description: |
        DRAFT or REJECTED → PENDING_REVIEW. Needs a complete profile with photo, at least one social account,
        one active package and payouts set up; otherwise 422 with one error per missing item
        (`field` = profile | photo | socials | packages | payouts). Any other status → 409.
      operationId: submitMyProfileForReview
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Submitted., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorMe' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /creators/me/stats:
    get:
      tags: [Creator workspace]
      summary: Dashboard numbers (FR-70)
      operationId: getMyCreatorStats
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stats., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorStats' } } } }

  /brands/me/profile:
    get:
      tags: [Brand workspace]
      summary: The signed-in brand's company profile (FR-05)
      operationId: getMyBrandProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The profile., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Brand workspace]
      summary: Save the company profile (FR-05)
      operationId: updateMyBrandProfile
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfileInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /files/presign:
    post:
      tags: [Files]
      summary: Get a pre-signed URL to upload an image straight to storage
      description: |
        The browser PUTs the file to `uploadUrl` with `headers`, then saves `fileUrl` on the profile.
        Images only (JPEG, PNG, WebP), at most 10 MB. Videos are added as links, not uploads.
      operationId: presignUpload
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PresignRequest' } } } }
      responses:
        '200': { description: Upload target., content: { application/json: { schema: { $ref: '#/components/schemas/PresignResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/quote:
    get:
      tags: [Orders]
      summary: Price a package or a custom offer before checkout (FR-30, FR-31, FR-60)
      description: |
        Server-side fee calculation with the brand's plan, so the checkout summary always matches what will be charged.
        Pass `packageId` for a package, or `creatorUsername` + `priceCents` for a custom offer.
      operationId: quoteOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: packageId, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: creatorUsername, in: query, schema: { type: string } }
        - { name: priceCents, in: query, schema: { type: integer, minimum: 1000 } }
        - { name: addonIds, in: query, description: 'Comma-separated package add-on ids (v2.4).', schema: { type: string } }
        - { name: promoCode, in: query, description: 'A promo code to apply (v3.3). An invalid code answers 422 with a field error on promoCode.', schema: { type: string } }
        - { name: useCredits, in: query, description: 'Apply the brand''s referral credits (v3.3).', schema: { type: boolean } }
      responses:
        '200': { description: The quote., content: { application/json: { schema: { $ref: '#/components/schemas/OrderQuote' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /referrals/{code}:
    get:
      tags: [Referrals]
      summary: Who invited you (public, for the sign-up page) (v3.3)
      operationId: getReferralInvite
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/ReferralInvite' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/referrals:
    get:
      tags: [Referrals]
      summary: Your referral code, the people you invited, and (brands) your credits (v3.3)
      description: |
        Brands invite brands: the new brand gets ₹500 credit at sign-up; you get ₹1,000 credit when their first order is completed.
        Creators invite creators: you get a ₹500 bonus in your balance when their first order is completed.
        Credits are promotional: they only reduce the price of orders, cannot be bought, withdrawn or transferred.
      operationId: getMyReferrals
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/ReferralOverview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/promo-codes:
    get:
      tags: [Admin]
      summary: Promo codes with their use (v3.3)
      operationId: listPromoCodes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: array, items: { $ref: '#/components/schemas/PromoCode' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a promo code (platform-funded discount for brands) (v3.3)
      operationId: createPromoCode
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromoCodeInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/PromoCode' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/promo-codes/{id}:
    patch:
      tags: [Admin]
      summary: Turn a promo code on or off (v3.3)
      operationId: updatePromoCode
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } } }
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/PromoCode' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order — buy a package or send a custom offer (FR-30, FR-31, FR-33)
      description: |
        Verified brands only (FR-02). `payment` is proof of an authorised Razorpay payment (UPI, card, netbanking or
        wallet app) for a session of exactly the order total; it is captured only when the creator accepts. The
        server verifies the signature and amount before creating the order, so a failed payment never creates
        one (402 PAYMENT_FAILED; 409 AMOUNT_MISMATCH if the price changed). Fees are copied onto the order. Repeating a request with the same `Idempotency-Key` returns the first result.
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreateRequest' } } } }
      responses:
        '201': { description: Order placed., content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Orders]
      summary: The signed-in brand's or creator's orders
      description: 'Brands see their own orders, creators the orders addressed to them. Sorted by urgency (v1.1): orders waiting on the caller first, then open orders by nearest deadline, then everything else by newest activity.'
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, description: 'Comma-separated OrderStatus values; empty = all.', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: One page of orders., content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: One order, as the brand or the creator sees it
      description: 404 for anyone who is not a participant, so order ids cannot be probed.
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: The order., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/accept:
    post:
      tags: [Orders]
      summary: Creator accepts (FR-32) — card captured into escrow
      description: PENDING_ACCEPTANCE → IN_PROGRESS within 72 h of the order. Needs a verified email. Sets the due date.
      operationId: acceptOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/decline:
    post:
      tags: [Orders]
      summary: Creator declines (FR-32) — hold released
      description: PENDING_ACCEPTANCE → CLOSED (DECLINED). The brand is never charged (FR-64).
      operationId: declineOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/deliver:
    post:
      tags: [Orders]
      summary: Creator delivers files and/or post links (FR-34)
      description: IN_PROGRESS → DELIVERED. Starts the 72-hour review window.
      operationId: deliverOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliverRequest' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/brief:
    post:
      tags: [Orders]
      summary: Brand updates the brief (FR-33)
      description: Allowed while PENDING_ACCEPTANCE or IN_PROGRESS.
      operationId: updateOrderBrief
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderBrief' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/approve:
    post:
      tags: [Orders]
      summary: Brand approves the delivery (FR-35) — creator paid
      description: "DELIVERED → COMPLETED within the review window. Escrow is released: creator balance gets price − creator fee."
      operationId: approveOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/request-revision:
    post:
      tags: [Orders]
      summary: Brand asks for a revision (FR-35, max 2)
      description: DELIVERED → IN_PROGRESS. The due date moves to at least 3 days from now.
      operationId: requestRevision
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteRequest' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/dispute:
    post:
      tags: [Orders]
      summary: Brand opens a dispute (FR-35)
      description: "DELIVERED → DISPUTED within the review window. Money stays in escrow until an admin decides (FR-81). v3.1: an optional `reasonCode`; the creator then has 48 hours to respond."
      operationId: disputeOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeRequest' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/dispute/response:
    post:
      tags: [Orders]
      summary: Creator answers a dispute (v3.1)
      description: Once, within 48 hours of the dispute being opened (409 ALREADY_RESPONDED, RESPONSE_WINDOW_PASSED). Shown to the brand and the admin.
      operationId: respondToDispute
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeResponseInput' } } } }
      responses:
        '200': { description: The order., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/dispute/evidence:
    post:
      tags: [Orders]
      summary: Brand or creator adds evidence to an open dispute (v3.1)
      description: "A file (image or PDF, uploaded with presign purpose DISPUTE_EVIDENCE) or a link, with an optional note. Up to 5 items per side (409 EVIDENCE_LIMIT); only while the dispute is open (409 DISPUTE_RESOLVED)."
      operationId: addDisputeEvidence
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeEvidenceInput' } } } }
      responses:
        '200': { description: The order., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel before acceptance (FR-37)
      description: Brand or creator, PENDING_ACCEPTANCE → CLOSED (CANCELED), hold released. After acceptance only an admin can cancel.
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: The order after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/drafts:
    post:
      tags: [Orders]
      summary: Share a draft for approval before posting (v2.4)
      description: Creator, while IN_PROGRESS. The brand approves it or asks for changes; money does not move. Then the creator posts and delivers as usual.
      operationId: shareDraft
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliverRequest' } } } }
      responses:
        '201': { description: Shared., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/drafts/{draftId}/review:
    post:
      tags: [Orders]
      summary: Approve a draft or ask for changes (v2.4)
      operationId: reviewDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { name: draftId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DraftReview' } } } }
      responses:
        '200': { description: Reviewed., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/shipment:
    put:
      tags: [Orders]
      summary: Add or update the product shipment to the creator (v2.4)
      description: Brand, when the brief needs shipping, while PENDING_ACCEPTANCE or IN_PROGRESS.
      operationId: saveShipment
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShipmentInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/shipment/received:
    post:
      tags: [Orders]
      summary: The creator received the product (v2.4)
      operationId: markShipmentReceived
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Marked received., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/extension:
    post:
      tags: [Orders]
      summary: Ask for more time (v2.4)
      description: Creator, while IN_PROGRESS, one pending request at a time, 1–14 extra days. The brand accepts (the due date moves) or declines.
      operationId: requestExtension
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtensionRequest' } } } }
      responses:
        '201': { description: Requested., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{id}/extension/review:
    post:
      tags: [Orders]
      summary: Accept or decline a request for more time (v2.4)
      operationId: reviewExtension
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtensionReview' } } } }
      responses:
        '200': { description: Decided., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/deliveries/{deliveryId}/metrics:
    put:
      tags: [Orders]
      summary: Record a post's results (manual metrics, v2.4)
      description: Creator, once DELIVERED or later. Shown to the brand on the order and the dashboard.
      operationId: savePostMetrics
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostMetricsInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /lists:
    get:
      tags: [Lists]
      summary: My saved lists of creators (FR-25, v2.5)
      operationId: listSavedLists
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Newest first., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedList' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Lists]
      summary: Create a list (max 20)
      operationId: createSavedList
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedListInput' } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/SavedList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /lists/{listId}:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Lists]
      summary: A list with its creators as search cards
      operationId: getSavedList
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The list., content: { application/json: { schema: { $ref: '#/components/schemas/SavedListDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lists]
      summary: Rename a list
      operationId: renameSavedList
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedListInput' } } } }
      responses:
        '200': { description: Renamed., content: { application/json: { schema: { $ref: '#/components/schemas/SavedList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Lists]
      summary: Delete a list
      operationId: deleteSavedList
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /lists/{listId}/creators/{username}:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: string } }
      - { name: username, in: path, required: true, schema: { type: string } }
    put:
      tags: [Lists]
      summary: Save a creator to a list (max 200 per list; idempotent)
      operationId: addToSavedList
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/SavedList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Lists]
      summary: Remove a creator from a list
      operationId: removeFromSavedList
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Removed., content: { application/json: { schema: { $ref: '#/components/schemas/SavedList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /creators/me/availability:
    put:
      tags: [Creators]
      summary: Vacation mode (v2.5)
      description: While away, the profile shows a notice, new orders and invites are refused (409 CREATOR_AWAY) and search cards show "Away". It switches off by itself after `until`.
      operationId: saveAvailability
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatorAvailability' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/CreatorAvailability' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /campaigns/{id}/invites:
    post:
      tags: [Campaigns]
      summary: Invite a creator to apply (FR-43, v2.5)
      operationId: inviteToCampaign
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignInviteInput' } } } }
      responses:
        '201': { description: Invited., content: { application/json: { schema: { $ref: '#/components/schemas/CampaignInvite' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /invites/{id}/decline:
    post:
      tags: [Campaigns]
      summary: Decline an invitation (creator)
      operationId: declineInvite
