      responses:
        '201': { description: Reported., content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/reports:
    get:
      tags: [Admin]
      summary: Reports queue (FR-85), open first
      operationId: listReports
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportStatus' } }
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/ReportList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/{id}/resolve:
    post:
      tags: [Admin]
      summary: Close a report — dismissed, or action taken
      operationId: resolveReport
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportResolveRequest' } } } }
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payments/sessions:
    post:
      tags: [Payments]
      summary: Open a payment session (a Razorpay order) for an exact amount
      description: |
        Step 1 of paying through Razorpay. The server creates a Razorpay order for `amountCents` and returns
        what Razorpay Checkout needs. The brand then pays in Checkout (UPI, card, netbanking or a wallet
        app); Checkout returns `razorpay_payment_id` and `razorpay_signature`, which the app sends with
        `POST /orders` or `POST /applications/{id}/accept`. Sessions use `payment_capture=0` (authorise only;
        captured when the creator accepts, released otherwise) and expire after 30 minutes.
      operationId: createPaymentSession
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSessionRequest' } } } }
      responses:
        '201': { description: Session opened., content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSession' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payments/methods:
    get:
      tags: [Payments]
      summary: The brand's saved payment methods (tokenised cards and UPI IDs)
      description: Cards are stored as RBI-compliant tokens at Razorpay, never on our servers; only the network, last four digits and expiry are shown.
      operationId: listPaymentMethods
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/SavedPaymentMethodList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/methods/{id}:
    delete:
      tags: [Payments]
      summary: Remove a saved payment method (deletes the Razorpay token)
      operationId: deletePaymentMethod
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /payouts/account:
    get:
      tags: [Payouts]
      summary: The creator's payout account (bank account or UPI ID), or null
      operationId: getPayoutAccount
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/PayoutAccount' }, { type: 'null' }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Payouts]
      summary: Add or change the payout account (FR-62)
      description: |
        Creates or updates the creator's Razorpay Route linked account with PAN and bank details (KYC), and
        verifies the destination (penny drop for bank accounts, VPA validation for UPI). Status moves
        VERIFYING → VERIFIED (payouts enabled) or FAILED with a reason.
      operationId: savePayoutAccount
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccountInput' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccount' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payouts/withdrawals:
    post:
      tags: [Payouts]
      summary: Withdraw now — standard (free) or instant (fee)
      description: |
        Pays part or all of the available balance to the payout account through RazorpayX.
        STANDARD goes by NEFT, free, usually the same or next working day. INSTANT goes by IMPS or UPI
        within minutes for a fee (see `PayoutOverview.instantFeeBps`, minimum `instantFeeMinCents`), taken
        from the amount. Minimum withdrawal `minWithdrawalCents`.
      operationId: createWithdrawal
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalRequest' } } } }
      responses:
        '201': { description: Payout started., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payouts/settings:
    put:
      tags: [Payouts]
      summary: Turn the automatic weekly payout on or off
      operationId: updatePayoutSettings
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutSettings' } } } }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/PayoutOverview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payouts/balance:
    get:
      tags: [Payouts]
      summary: Creator balance, transfers and bank payouts (FR-63)
      description: "Approved work moves to the balance (a Razorpay Route transfer released from hold); the balance is paid out every Monday (UTC) if `autoWeekly` is on, or on request (`POST /payouts/withdrawals`)."
      operationId: getPayoutBalance
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK., content: { application/json: { schema: { $ref: '#/components/schemas/PayoutOverview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creators/{username}:
    get:
      tags: [Creators]
      summary: Public creator profile (FR-15)
      description: |
        Public, no login needed. 404 unless the creator is APPROVED — except that the creator themself and
        admins can preview an unapproved profile (then `vettingStatus` tells them it is not live).
        Each view by someone other than the creator counts toward profile views (FR-70).
      operationId: getCreatorProfile
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique per user action (a UUID). Retrying with the same key returns the first result instead of acting twice.
      schema: { type: string, maxLength: 100 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Not signed in, the token expired, or the credentials are wrong.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not allowed (wrong role, not the owner, account suspended, email not verified).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or the caller may not know it exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with the current state (duplicate email, invalid order transition).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: One or more fields are invalid. See `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- Shared ----------
    Money:
      type: object
      description: An amount in integer minor units (cents for USD).
      required: [amountCents, currency]
      properties:
        amountCents: { type: integer, format: int64, examples: [22000] }
        currency: { type: string, minLength: 3, maxLength: 3, examples: [USD] }

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [status, title]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string, examples: [Validation failed] }
        status: { type: integer, examples: [422] }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable reason, e.g. EMAIL_TAKEN, EMAIL_NOT_VERIFIED, INVALID_TRANSITION, TOKEN_EXPIRED.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [email] }
        message: { type: string, examples: [This email already has an account.] }

    PageMeta:
      type: object
      description: Paging fields returned next to `content` by every list endpoint.
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0, description: Zero-based page number. }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    # ---------- Users ----------
    Role:
      type: string
      enum: [BRAND, CREATOR, ADMIN]

    SignupRole:
      type: string
      description: Roles a person can choose at sign-up. ADMIN accounts are created by staff only.
      enum: [BRAND, CREATOR]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, BANNED]

    VettingStatus:
      type: string
      description: Creator profile vetting (FR-16). Only APPROVED profiles appear in search.
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED]

    CreatorSummary:
      type: object
      required: [username, vettingStatus]
      properties:
        username: { type: [string, 'null'], description: Chosen during onboarding; null until then. }
        vettingStatus: { $ref: '#/components/schemas/VettingStatus' }
        rejectionReason: { type: [string, 'null'] }

    BrandSummary:
      type: object
      required: [companyName]
      properties:
        companyName: { type: [string, 'null'] }

    Me:
      type: object
      required: [id, email, name, role, status, emailVerified, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified:
          type: boolean
          description: Placing or accepting orders needs a verified email (FR-02).
        createdAt: { type: string, format: date-time }
        impersonatedBy: { type: [string, 'null'], description: 'Set in a read-only admin impersonation session (FR-82): the admin''s name.' }
        avatarUrl: { type: [string, 'null'], description: 'Picture for the account menu (v2.1): creator photo, brand logo or admin avatar; null shows initials.' }
        creator: { $ref: '#/components/schemas/CreatorSummary' }
        brand: { $ref: '#/components/schemas/BrandSummary' }

    AvatarUpdate:
      type: object
      required: [url]
      properties:
        url: { type: [string, 'null'], maxLength: 2000000, description: 'Uploaded image URL; null removes it (not allowed for creators).' }

    UpdateMeRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }

    # ---------- Creators ----------
    Platform:
      type: string
      enum: [INSTAGRAM, TIKTOK, YOUTUBE, UGC]

    Niche:
      type: string
      enum: [BEAUTY, FASHION, FITNESS, FOOD, TRAVEL, TECH, GAMING, LIFESTYLE, PARENTING, FINANCE, HOME, PETS, MUSIC, EDUCATION, COMEDY, WELLNESS, SUSTAINABILITY, AUTOMOTIVE]

    Gender:
      type: string
      enum: [FEMALE, MALE, NON_BINARY]

    PlatformReach:
      type: object
      required: [platform, handle, followers]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, examples: [leomakes] }
        followers: { type: integer, format: int64 }

    CreatorCard:
      type: object
      description: Search result card (FR-24).
      required: [username, displayName, photoUrl, city, country, niches, reach, startingPriceCents, currency, ratingAvg, ratingCount, verified]
      properties:
        username: { type: string }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'], description: ISO 3166-1 alpha-2. }
        niches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Niche' }
        reach:
          description: The filtered platform's account, or else the creator's largest. Null if no socials.
          oneOf:
            - $ref: '#/components/schemas/PlatformReach'
            - type: 'null'
        startingPriceCents:
          type: [integer, 'null']
          format: int64
          description: Cheapest active package (on the filtered platform, if any). Null if none.
        currency: { type: string, examples: [USD] }
        ratingAvg:
          type: [number, 'null']
          description: Average of review ratings, one decimal. Null when there are no reviews.
          examples: [4.8]
        ratingCount: { type: integer }
        verified:
          type: boolean
          description: At least one social account was verified by our team (badge).

    CreatorSearchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CreatorCard' }

    SocialAccount:
      type: object
      required: [id, platform, handle, url, followers, engagementRateBps, verified]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string }
        url: { type: [string, 'null'], format: uri }
        followers: { type: integer, format: int64 }
        engagementRateBps:
          type: [integer, 'null']
          description: Engagement rate in basis points, e.g. 345 = 3.45 %.
        verified: { type: boolean }

    Package:
      type: object
      description: A priced offer (FR-12). Price is integer cents, minimum 1000.
      required: [id, platform, title, description, deliverables, priceCents, currency, deliveryDays]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        deliverables:
          type: array
          items: { type: string, maxLength: 120 }
        priceCents: { type: integer, format: int64, minimum: 1000 }
        currency: { type: string, examples: [USD] }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }

    PortfolioItem:
      type: object
      required: [id, type, url, caption]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { type: string, enum: [IMAGE, VIDEO_LINK] }
        url: { type: string, format: uri-reference }
        caption: { type: [string, 'null'], maxLength: 140 }

    Review:
      type: object
      required: [id, rating, comment, brandName, createdAt, creatorReply, repliedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        brandName: { type: string }
        createdAt: { type: string, format: date-time }
        creatorReply: { type: [string, 'null'] }
        repliedAt: { type: [string, 'null'], format: date-time }

    CreatorProfile:
      allOf:
        - $ref: '#/components/schemas/CreatorCard'
        - type: object
          required: [bio, languages, coverUrls, socials, packages, portfolio, reviews, memberSince, vettingStatus, completedOrders, typicalAcceptHours]
          properties:
            bio: { type: [string, 'null'] }
            completedOrders: { type: integer, description: 'Orders completed on the platform (v1.1).' }
            typicalAcceptHours: { type: [integer, 'null'], description: 'Median hours from order to acceptance over the last 20 accepted orders, rounded up; null with fewer than 3 (v1.1).' }
            languages:
              type: array
              items: { type: string, description: ISO 639-1. }
            coverUrls:
              type: array
              maxItems: 3
              items: { type: string, format: uri-reference }
            socials:
              type: array
              items: { $ref: '#/components/schemas/SocialAccount' }
            packages:
              type: array
              description: Active packages only, cheapest first.
              items: { $ref: '#/components/schemas/Package' }
            portfolio:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/PortfolioItem' }
            reviews:
              type: array
              description: Latest 20 reviews; `ratingCount` has the total.
              items: { $ref: '#/components/schemas/Review' }
            memberSince: { type: string, format: date-time }
            vettingStatus:
              $ref: '#/components/schemas/VettingStatus'
              description: Always APPROVED for the public; other values only in an owner or admin preview.

    # ---------- Creator workspace (Week 3) ----------
    CreatorProfileInput:
      type: object
      required: [username, displayName, bio, city, country, languages, niches]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-z][a-z0-9._]{2,29}$' }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        bio: { type: string, minLength: 30, maxLength: 1000 }
        city: { type: string, minLength: 2, maxLength: 80 }
        country: { type: string, minLength: 2, maxLength: 2 }
        gender:
          oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }]
          description: Optional. Used only as a search filter, never shown on the profile.
        birthYear: { type: [integer, 'null'], description: 'Optional, age 16–90. Search filter only, never shown.' }
        languages: { type: array, minItems: 1, maxItems: 5, items: { type: string, minLength: 2, maxLength: 2 } }
        niches: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { $ref: '#/components/schemas/Niche' } }
        photoUrl: { type: [string, 'null'] }
        coverUrls: { type: array, maxItems: 3, items: { type: string } }

    SocialAccountInput:
      type: object
      required: [platform, handle, followers]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, minLength: 2, maxLength: 40, pattern: '^[A-Za-z0-9._]+$', description: Without the @. }
        followers: { type: integer, minimum: 0, maximum: 1000000000 }

    PackageInput:
      type: object
      required: [platform, title, description, deliverables, priceCents, deliveryDays]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }
        active: { type: boolean, default: true }

    PackagePatch:
      type: object
      description: Any subset of PackageInput fields.
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        title: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }
        active: { type: boolean }

    OwnPackage:
      allOf:
        - $ref: '#/components/schemas/Package'
        - type: object
          required: [active]
          properties:
            active: { type: boolean }

    PortfolioItemInput:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [IMAGE, VIDEO_LINK] }
        url: { type: string, maxLength: 2000000, description: 'IMAGE: a fileUrl from /files/presign. VIDEO_LINK: an https URL.' }
        caption: { type: [string, 'null'], maxLength: 140 }

    PayoutStatus:
      type: string
      description: NOT_STARTED → PENDING (payout account being verified) → ENABLED (verified; payouts can be sent).
      enum: [NOT_STARTED, PENDING, ENABLED]

    CreatorChecklist:
      type: object
      description: What is still needed before the profile can be submitted. Portfolio is recommended, not required.
      required: [profile, photo, socials, packages, portfolio, payouts]
      properties:
        profile: { type: boolean }
        photo: { type: boolean }
        socials: { type: boolean }
        packages: { type: boolean }
        portfolio: { type: boolean }
        payouts: { type: boolean }

    CreatorMe:
      type: object
      required: [username, displayName, bio, city, country, gender, birthYear, languages, niches, photoUrl, coverUrls, vettingStatus, rejectionReason, submittedAt, socials, packages, portfolio, payoutStatus, checklist, usernameLocked]
      properties:
        username: { type: [string, 'null'] }
        displayName: { type: string }
        bio: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        birthYear: { type: [integer, 'null'] }
        languages: { type: array, items: { type: string } }
        niches: { type: array, items: { $ref: '#/components/schemas/Niche' } }
        photoUrl: { type: [string, 'null'] }
        coverUrls: { type: array, items: { type: string } }
        vettingStatus: { $ref: '#/components/schemas/VettingStatus' }
        rejectionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        socials: { type: array, items: { $ref: '#/components/schemas/SocialAccount' } }
        packages: { type: array, description: Active and inactive., items: { $ref: '#/components/schemas/OwnPackage' } }
        portfolio: { type: array, items: { $ref: '#/components/schemas/PortfolioItem' } }
        payoutStatus: { $ref: '#/components/schemas/PayoutStatus' }
        checklist: { $ref: '#/components/schemas/CreatorChecklist' }
        usernameLocked: { type: boolean, description: True once the profile has been approved. }

    CreatorStats:
      type: object
      required: [currency, availableCents, inEscrowCents, lifetimeEarnedCents, ordersByStatus, profileViews, activePackages]
      properties:
        currency: { type: string }
        availableCents: { type: integer, format: int64, description: Creator balance not yet paid out. }
        inEscrowCents: { type: integer, format: int64, description: What the creator will receive for accepted orders not yet approved. }
        lifetimeEarnedCents: { type: integer, format: int64 }
        ordersByStatus:
          type: object
          description: Count per order status; every status is present.
          additionalProperties: { type: integer }
        profileViews: { type: integer }
        activePackages: { type: integer }

    BrandIndustry:
      type: string
      enum: [BEAUTY, FASHION, FOOD, HEALTH, HOME, TECH, TRAVEL, FINANCE, EDUCATION, PETS, AGENCY, OTHER]

    BrandProfile:
      type: object
      required: [companyName, website, logoUrl, industry, country, plan]
      properties:
        companyName: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        industry: { oneOf: [{ $ref: '#/components/schemas/BrandIndustry' }, { type: 'null' }] }
        country: { type: [string, 'null'] }
        plan: { type: string, enum: [FREE], description: Pro / Premium arrive in v2. }

    BrandProfileInput:
      type: object
      required: [companyName, industry, country]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 100 }
        website: { type: [string, 'null'], maxLength: 200, description: 'https://… (http:// accepted and upgraded).' }
        logoUrl: { type: [string, 'null'] }
        industry: { $ref: '#/components/schemas/BrandIndustry' }
        country: { type: string, minLength: 2, maxLength: 2 }

    PresignRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      properties:
        purpose: { type: string, enum: [AVATAR, COVER, PORTFOLIO, BRAND_LOGO, BRIEF_REFERENCE, DELIVERABLE] }
        fileName: { type: string, maxLength: 200 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }

    PresignResponse:
      type: object
      required: [uploadUrl, method, headers, fileUrl, expiresAt]
      properties:
        uploadUrl: { type: string }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        fileUrl: { type: string, description: Where the file will be served from once uploaded. }
        expiresAt: { type: string, format: date-time }

    # ---------- Admin (Week 6) ----------
    AdminSummary:
      type: object
      required: [pendingVetting, openDisputes, openReports]
      properties:
        pendingVetting: { type: integer }
        openDisputes: { type: integer }
        openReports: { type: integer }

    VettingItem:
      type: object
      required: [creatorId, username, displayName, email, photoUrl, bio, city, country, niches, languages, socials, packages, portfolio, vettingStatus, rejectionReason, submittedAt, createdAt]
      properties:
        creatorId: { $ref: '#/components/schemas/Ulid' }
        username: { type: [string, 'null'] }
        displayName: { type: string }
        email: { type: string }
        photoUrl: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        niches: { type: array, items: { $ref: '#/components/schemas/Niche' } }
        languages: { type: array, items: { type: string } }
        socials: { type: array, items: { $ref: '#/components/schemas/SocialAccount' } }
        packages: { type: array, items: { $ref: '#/components/schemas/OwnPackage' } }
        portfolio: { type: array, items: { $ref: '#/components/schemas/PortfolioItem' } }
        vettingStatus: { $ref: '#/components/schemas/VettingStatus' }
        rejectionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    VettingQueue:
      type: object
      required: [content]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/VettingItem' } }

    RequiredReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }

    AdminDispute:
      type: object
      required: [id, orderId, orderTitle, brand, creator, money, reason, status, openedAt, resolution, refundCents, resolvedAt, resolutionNote]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        orderId: { $ref: '#/components/schemas/Ulid' }
        orderTitle: { type: string }
        brand: { $ref: '#/components/schemas/OrderParty' }
        creator: { $ref: '#/components/schemas/OrderParty' }
        money: { $ref: '#/components/schemas/OrderMoney' }
        reason: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        openedAt: { type: string, format: date-time }
        resolution: { type: [string, 'null'], enum: [RELEASE, FULL_REFUND, PARTIAL_REFUND, null] }
        refundCents: { type: [integer, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionNote: { type: [string, 'null'] }

    AdminDisputeList:
      type: object
      required: [content]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AdminDispute' } }

    ResolveDisputeRequest:
      type: object
      required: [resolution, note]
      properties:
        resolution: { type: string, enum: [RELEASE, FULL_REFUND, PARTIAL_REFUND] }
        refundCents: { type: [integer, 'null'], format: int64, description: Required for PARTIAL_REFUND. }
        note: { type: string, minLength: 10, maxLength: 1000, description: Shown to both sides and kept in the audit log. }

    AdminUser:
      type: object
      required: [id, name, email, role, status, emailVerified, createdAt, lastActiveAt, orderCount, label]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time, description: 'Last sign-in or token refresh (v1.1).' }
        orderCount: { type: integer }
        label: { type: [string, 'null'], description: Company name or creator username. }

    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }

    UserStatusChange:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        reason: { type: string, minLength: 10, maxLength: 500 }

    FeeRates:
      type: object
      required: [plan, brandFeeBps, creatorFeeBps]
      properties:
        plan: { type: string, enum: [FREE] }
        brandFeeBps: { type: integer, minimum: 0, maximum: 3000 }
        creatorFeeBps: { type: integer, minimum: 0, maximum: 3000 }

    FeeConfigEntry:
      allOf:
        - $ref: '#/components/schemas/FeeRates'
        - type: object
          required: [effectiveFrom, changedBy]
          properties:
            effectiveFrom: { type: string, format: date-time }
            changedBy: { type: [string, 'null'] }

    FeeSettings:
      type: object
      required: [current, history]
      properties:
        current: { $ref: '#/components/schemas/FeeConfigEntry' }
        history: { type: array, description: Newest first., items: { $ref: '#/components/schemas/FeeConfigEntry' } }

    FeeUpdate:
      type: object
      required: [brandFeeBps, creatorFeeBps]
      properties:
        brandFeeBps: { type: integer, minimum: 0, maximum: 3000, description: 'Basis points: 1000 = 10%. At most 30%.' }
        creatorFeeBps: { type: integer, minimum: 0, maximum: 3000 }

    AuditAction:
      type: string
      enum: [CREATOR_APPROVED, CREATOR_REJECTED, DISPUTE_RESOLVED, USER_STATUS_CHANGED, IMPERSONATION_STARTED, FEES_CHANGED, REPORT_RESOLVED, MONEY_MOVEMENT, PAYOUT_SENT]

    AuditEntry:
      type: object
      required: [id, actorName, action, entityType, entityId, summary, before, after, ip, at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        actorName: { type: string, description: SYSTEM for scheduled jobs. }
        action: { $ref: '#/components/schemas/AuditAction' }
        entityType: { type: string, examples: [ORDER, USER, CREATOR_PROFILE, FEE_CONFIG, REPORT, PAYOUT] }
        entityId: { type: string }
        summary: { type: string }
        before: { description: JSON snapshot before the change, or null. }
        after: { description: JSON snapshot after the change, or null. }
        ip: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

    # ---------- Reports (Week 6) ----------
    ReportTargetType:
      type: string
      enum: [CREATOR, BRAND, MESSAGE, REVIEW]

    ReportReason:
      type: string
      enum: [SPAM, FAKE_ACCOUNT, INAPPROPRIATE, SCAM, OFF_PLATFORM_PAYMENT, OTHER]

    ReportStatus:
      type: string
      enum: [OPEN, DISMISSED, ACTION_TAKEN]

    ReportInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string, description: 'Creator username, brand user id, message id or review id.' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'], maxLength: 1000 }

    Report:
      type: object
      required: [id, targetType, targetId, targetLabel, targetLink, reason, details, reporterName, status, createdAt, resolvedAt, resolutionNote]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string }
        targetLabel: { type: string }
        targetLink: { type: [string, 'null'] }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'] }
        reporterName: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionNote: { type: [string, 'null'] }

    ReportList:
      type: object
      required: [content]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Report' } }

    ReportResolveRequest:
      type: object
      required: [status, note]
      properties:
        status: { type: string, enum: [DISMISSED, ACTION_TAKEN] }
        note: { type: string, minLength: 5, maxLength: 1000 }

    # ---------- Payouts (Week 6) ----------
    Transfer:
      type: object
      description: Approved work moved to the creator balance (a Razorpay Route transfer released from hold).
      required: [orderId, orderTitle, amountCents, at]
      properties:
        orderId: { $ref: '#/components/schemas/Ulid' }
        orderTitle: { type: string }
        amountCents: { type: integer, format: int64 }
        at: { type: string, format: date-time }

    Payout:
      type: object
      description: Money sent from the balance to the payout account (RazorpayX payout).
      required: [id, amountCents, feeCents, speed, destinationLabel, status, createdAt, arrivalDate]
      properties:
        id: { type: string, examples: [pout_mock123] }
        amountCents: { type: integer, format: int64, description: Taken from the balance. }
        feeCents: { type: integer, format: int64, description: Instant payout fee; the creator receives amount − fee. }
        speed: { type: string, enum: [SCHEDULED, STANDARD, INSTANT] }
        destinationLabel: { type: string, examples: ['HDFC Bank •••• 4321'] }
        status: { type: string, enum: [IN_TRANSIT, PAID] }
        createdAt: { type: string, format: date-time }
        arrivalDate: { type: string, format: date-time }

    PayoutOverview:
      type: object
      required: [currency, availableCents, inEscrowCents, lifetimeEarnedCents, paidOutCents, nextPayoutAt, schedule, payoutStatus, transfers, payouts, account, autoWeekly, minWithdrawalCents, instantFeeBps, instantFeeMinCents]
      properties:
        currency: { type: string }
        availableCents: { type: integer, format: int64, description: Balance waiting for the next payout. }
        inEscrowCents: { type: integer, format: int64 }
        lifetimeEarnedCents: { type: integer, format: int64 }
        paidOutCents: { type: integer, format: int64 }
        nextPayoutAt: { type: string, format: date-time }
        schedule: { type: string, enum: [WEEKLY_MONDAY] }
        payoutStatus: { $ref: '#/components/schemas/PayoutStatus' }
        transfers: { type: array, description: Newest first., items: { $ref: '#/components/schemas/Transfer' } }
        payouts: { type: array, description: Newest first., items: { $ref: '#/components/schemas/Payout' } }
        account: { oneOf: [{ $ref: '#/components/schemas/PayoutAccount' }, { type: 'null' }] }
        autoWeekly: { type: boolean }
        minWithdrawalCents: { type: integer, format: int64, examples: [50000] }
        instantFeeBps: { type: integer, examples: [100] }
        instantFeeMinCents: { type: integer, format: int64, examples: [1000] }

    # ---------- Payments and payouts (v2.0, India / Razorpay) ----------
    PaymentMethodType:
      type: string
      description: How the brand paid through Razorpay. WALLET_APP is a third-party wallet (Paytm, PhonePe, Amazon Pay, MobiKwik).
      enum: [UPI, CARD, NETBANKING, WALLET_APP]

    PaymentSessionRequest:
      type: object
      required: [purpose, amountCents]
      properties:
        purpose: { type: string, enum: [ORDER] }
        amountCents: { type: integer, format: int64, minimum: 100, description: 'The quoted total (price + brand fee); the server rechecks it when the order is placed.' }

    PaymentSession:
      type: object
      required: [id, purpose, amountCents, currency, razorpayOrderId, razorpayKeyId, expiresAt]
      properties:
        id: { type: string }
        purpose: { type: string, enum: [ORDER] }
        amountCents: { type: integer, format: int64 }
        currency: { type: string, examples: [INR] }
        razorpayOrderId: { type: string, examples: [order_Mock123] }
        razorpayKeyId: { type: string, description: Publishable key for Razorpay Checkout. }
        expiresAt: { type: string, format: date-time }

    OrderPaymentInput:
      type: object
      description: Proof from Razorpay Checkout that a session of exactly the order total was authorised.
      required: [sessionId, razorpayPaymentId, razorpaySignature]
      properties:
        sessionId: { type: string }
        razorpayPaymentId: { type: string, examples: [pay_Mock123] }
        razorpaySignature: { type: string, description: 'HMAC-SHA256 of "razorpay_order_id|razorpay_payment_id" with the key secret; verified server-side.' }

    SavedPaymentMethod:
      type: object
      required: [id, type, label, network, last4, expiry, vpa, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [CARD, UPI] }
        label: { type: string, examples: ['Visa •••• 1111', 'maya@okhdfc'] }
        network: { type: [string, 'null'], examples: [Visa] }
        last4: { type: [string, 'null'] }
        expiry: { type: [string, 'null'], examples: ['12/29'] }
        vpa: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    SavedPaymentMethodList:
      type: object
      required: [content]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SavedPaymentMethod' } }

    PayoutAccountInput:
      type: object
      required: [pan, holderName, method]
      properties:
        pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$', description: Permanent Account Number (KYC and TDS). }
        holderName: { type: string, minLength: 2, maxLength: 100, description: As on the bank account. }
        method: { type: string, enum: [BANK_ACCOUNT, UPI] }
        accountNumber: { type: [string, 'null'], pattern: '^[0-9]{9,18}$' }
        ifsc: { type: [string, 'null'], pattern: '^[A-Z]{4}0[A-Z0-9]{6}$' }
        vpa: { type: [string, 'null'], description: 'UPI ID, e.g. name@okaxis.' }

    PayoutAccount:
      type: object
      required: [method, holderName, panMasked, destinationLabel, status, failureReason, updatedAt]
      properties:
        method: { type: string, enum: [BANK_ACCOUNT, UPI] }
        holderName: { type: string }
        panMasked: { type: string, examples: ['ABCDE••••F'] }
        destinationLabel: { type: string, examples: ['HDFC Bank •••• 4321', 'leo@okaxis'] }
        status: { type: string, enum: [VERIFYING, VERIFIED, FAILED] }
        failureReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    WithdrawalRequest:
      type: object
      required: [amountCents, speed]
      properties:
        amountCents: { type: integer, format: int64 }
        speed: { type: string, enum: [STANDARD, INSTANT] }

    PayoutSettings:
      type: object
      required: [autoWeekly]
      properties:
        autoWeekly: { type: boolean, description: Pay the whole available balance every Monday. }

    # ---------- Campaigns (Week 5) ----------
    CampaignStatus:
      type: string
      description: OPEN until the brand closes it. Creators can apply only while OPEN and before the deadline.
      enum: [OPEN, CLOSED]

    CampaignInput:
      type: object
      required: [title, brief, platforms, niches, deliverables, budgetPerCreatorCents, deadline]
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        brief: { type: string, minLength: 30, maxLength: 4000 }
        platforms: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Platform' } }
        niches: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { $ref: '#/components/schemas/Niche' } }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        budgetPerCreatorCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deadline: { type: string, format: date, description: 'Last day to apply; 1 to 180 days from today.' }

    CampaignSummary:
      type: object
      required: [id, brand, title, platforms, niches, budgetPerCreatorCents, currency, deadline, status, open, applicationCount, myApplication, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        brand: { $ref: '#/components/schemas/OrderParty' }
        title: { type: string }
        platforms: { type: array, items: { $ref: '#/components/schemas/Platform' } }
        niches: { type: array, items: { $ref: '#/components/schemas/Niche' } }
        budgetPerCreatorCents: { type: integer, format: int64 }
        currency: { type: string }
        deadline: { type: string, format: date }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        open: { type: boolean, description: OPEN and the deadline has not passed. }
        applicationCount: { type: integer, description: Shown to the owning brand; 0 for creators. }
        myApplication: { oneOf: [{ $ref: '#/components/schemas/Application' }, { type: 'null' }], description: "The creator's own application, if any." }
        createdAt: { type: string, format: date-time }

    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [brief, deliverables, applications]
          properties:
            brief: { type: string }
            deliverables: { type: array, items: { type: string } }
            applications: { type: array, description: Owning brand only; empty for creators., items: { $ref: '#/components/schemas/Application' } }

    CampaignPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/CampaignSummary' } }

    ApplicationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN]

    Application:
      type: object
      required: [id, campaignId, creator, pitch, priceCents, currency, deliveryDays, status, orderId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        campaignId: { $ref: '#/components/schemas/Ulid' }
        creator: { allOf: [{ $ref: '#/components/schemas/OrderParty' }], description: Includes the creator's reach for the brand to compare. }
        reach: { oneOf: [{ $ref: '#/components/schemas/PlatformReach' }, { type: 'null' }] }
        ratingAvg: { type: [number, 'null'] }
        ratingCount: { type: integer }
        pitch: { type: string }
        priceCents: { type: integer, format: int64 }
        currency: { type: string }
        deliveryDays: { type: integer }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        orderId: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: 'null' }], description: Set once accepted. }
        createdAt: { type: string, format: date-time }

    ApplicationInput:
      type: object
      required: [pitch, priceCents, deliveryDays]
      properties:
        pitch: { type: string, minLength: 30, maxLength: 1000 }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60 }

    ApplicationAcceptRequest:
      type: object
      required: [payment]
      properties:
        note: { type: [string, 'null'], maxLength: 2000, description: Extra instructions added to the campaign brief. }
        payment: { $ref: '#/components/schemas/OrderPaymentInput' }

    # ---------- Chat (Week 5) ----------
    ChatMessage:
      type: object
      required: [id, conversationId, mine, senderName, body, masked, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        conversationId: { $ref: '#/components/schemas/Ulid' }
        mine: { type: boolean }
        senderName: { type: string }
        body: { type: string }
        masked: { type: boolean, description: Contact details were hidden (FR-51). }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time, description: 'When the other participant read it (v1.1).' }

    MessageList:
      type: object
      required: [messages, contactsHidden, serverTime]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        contactsHidden: { type: boolean, description: True until the order is completed (FR-51). }
        serverTime: { type: string, format: date-time }

    MessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    Conversation:
      type: object
      required: [id, orderId, orderTitle, orderStatus, counterparty, lastMessage, unreadCount, contactsHidden, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        orderId: { $ref: '#/components/schemas/Ulid' }
        orderTitle: { type: string }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        counterparty: { $ref: '#/components/schemas/OrderParty' }
        lastMessage: { oneOf: [{ $ref: '#/components/schemas/ChatMessage' }, { type: 'null' }] }
        unreadCount: { type: integer }
        contactsHidden: { type: boolean }
        updatedAt: { type: string, format: date-time }

    ConversationList:
      type: object
      required: [content, unreadTotal]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        unreadTotal: { type: integer }

    # ---------- Notifications (Week 5) ----------
    NotificationType:
      type: string
      enum: [ORDER_EVENT, NEW_APPLICATION, APPLICATION_ACCEPTED, APPLICATION_REJECTED, PROFILE_APPROVED, PROFILE_REJECTED, PAYOUT_SENT]

    Notification:
      type: object
      required: [id, type, title, body, link, read, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: 'App path to open, e.g. /brand/orders/{id}.' }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content, unreadCount]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unreadCount: { type: integer }

    MarkReadRequest:
      type: object
      description: Either ids, or all = true.
      properties:
        ids: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Ulid' } }
        all: { type: boolean }

    # ---------- Brand dashboard (Week 5) ----------
    DeliveredPost:
      type: object
      required: [orderId, orderTitle, creatorName, url, deliveredAt]
      properties:
        orderId: { $ref: '#/components/schemas/Ulid' }
        orderTitle: { type: string }
        creatorName: { type: string }
        url: { type: string }
        deliveredAt: { type: string, format: date-time }

    BrandStats:
      type: object
      required: [currency, spentCents, inEscrowCents, authorisedCents, ordersByStatus, deliveredPosts, openCampaigns, pendingApplications, spendByMonth]
      properties:
        currency: { type: string }
        spentCents: { type: integer, format: int64, description: "Charged to the brand's card, minus refunds." }
        inEscrowCents: { type: integer, format: int64, description: Charged and held until approval. }
        authorisedCents: { type: integer, format: int64, description: Card holds on orders not yet accepted (not charged). }
        ordersByStatus: { type: object, additionalProperties: { type: integer } }
        deliveredPosts: { type: array, description: 'Live post links from deliveries, newest first (FR-71).', items: { $ref: '#/components/schemas/DeliveredPost' } }
        openCampaigns: { type: integer }
        pendingApplications: { type: integer }
        spendByMonth:
          type: array
          description: 'Card charges minus refunds per calendar month (UTC), last 6 months, oldest first, including empty months (v1.1).'
          items:
            type: object
            required: [month, cents]
            properties:
              month: { type: string, pattern: '^d{4}-d{2}$', examples: ['2026-11'] }
              cents: { type: integer, format: int64 }

    # ---------- Orders (Week 4) ----------
    OrderStatus:
      type: string
      enum: [PENDING_ACCEPTANCE, IN_PROGRESS, DELIVERED, COMPLETED, DISPUTED, REFUNDED, CLOSED]

    CloseReason:
      type: string
      enum: [DECLINED, EXPIRED, CANCELED]

    PaymentStatus:
      type: string
      description: AUTHORIZED (held, not charged) → CAPTURED (in escrow) → REFUNDED, or CANCELED (hold released).
      enum: [AUTHORIZED, CAPTURED, REFUNDED, CANCELED]

    OrderAction:
      type: string
      description: What the viewer may do now. The UI offers only these; the server checks again.
      enum: [ACCEPT, DECLINE, CANCEL, DELIVER, EDIT_BRIEF, APPROVE, REQUEST_REVISION, DISPUTE, REVIEW, REPLY]

    OrderKind:
      type: string
      enum: [PACKAGE, CUSTOM_OFFER, CAMPAIGN]

    ShippingAddress:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string, maxLength: 100 }
        line1: { type: string, maxLength: 200 }
        line2: { type: [string, 'null'], maxLength: 200 }
        city: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2 }

    OrderBrief:
      type: object
      description: FR-33. What the brand wants.
      required: [requirements, needsShipping]
      properties:
        requirements: { type: string, minLength: 20, maxLength: 4000 }
        needsShipping: { type: boolean, description: The creator needs the product shipped to them. }
        shippingAddress: { oneOf: [{ $ref: '#/components/schemas/ShippingAddress' }, { type: 'null' }], description: 'Required when needsShipping. Where the brand ships to — collected from the creator after acceptance in v2; the brand enters it now for MVP.' }
        links: { type: array, maxItems: 5, items: { type: string, maxLength: 500 } }
        referenceFiles: { type: array, maxItems: 5, items: { type: string }, description: File URLs from /files/presign. }

    CustomOfferInput:
      type: object
      required: [title, platform, deliverables, priceCents, deliveryDays]
      properties:
        title: { type: string, minLength: 3, maxLength: 80 }
        platform: { $ref: '#/components/schemas/Platform' }
        deliverables: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 2, maxLength: 120 } }
        priceCents: { type: integer, format: int64, minimum: 1000, maximum: 10000000 }
        deliveryDays: { type: integer, minimum: 1, maximum: 60, description: Days after the creator accepts. }

    OrderCreateRequest:
      type: object
      description: Either `packageId`, or `creatorUsername` + `offer` for a custom offer.
      required: [brief, payment]
      properties:
        packageId: { $ref: '#/components/schemas/Ulid' }
        creatorUsername: { type: string }
        offer: { $ref: '#/components/schemas/CustomOfferInput' }
        brief: { $ref: '#/components/schemas/OrderBrief' }
        payment: { $ref: '#/components/schemas/OrderPaymentInput' }

    OrderCreated:
      type: object
      required: [orderId, status, priceCents, brandFeeCents, totalCents, currency, acceptBy]
      properties:
        orderId: { $ref: '#/components/schemas/Ulid' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        priceCents: { type: integer, format: int64 }
        brandFeeCents: { type: integer, format: int64 }
        totalCents: { type: integer, format: int64, examples: [22000] }
        currency: { type: string }
        acceptBy: { type: string, format: date-time }

    OrderQuote:
      type: object
      required: [kind, creator, package, priceCents, brandFeeCents, totalCents, brandFeeBps, currency, acceptWindowHours]
      properties:
        kind: { $ref: '#/components/schemas/OrderKind' }
        creator: { $ref: '#/components/schemas/OrderParty' }
        package: { oneOf: [{ $ref: '#/components/schemas/Package' }, { type: 'null' }] }
        priceCents: { type: integer, format: int64 }
        brandFeeCents: { type: integer, format: int64 }
        totalCents: { type: integer, format: int64 }
        brandFeeBps: { type: integer, examples: [1000] }
        currency: { type: string }
        acceptWindowHours: { type: integer, examples: [72] }

    OrderParty:
      type: object
      description: The other side of an order, as shown on it.
      required: [name, photoUrl, username]
      properties:
        name: { type: string }
        photoUrl: { type: [string, 'null'] }
        username: { type: [string, 'null'], description: Creator username (links to the profile); null for brands. }

    OrderMoney:
      type: object
      description: Copied onto the order at checkout; later fee changes never alter it.
      required: [currency, priceCents, brandFeeCents, totalCents, creatorFeeCents, creatorPayoutCents]
      properties:
        currency: { type: string }
        priceCents: { type: integer, format: int64 }
        brandFeeCents: { type: integer, format: int64 }
        totalCents: { type: integer, format: int64, description: What the brand pays. }
        creatorFeeCents: { type: integer, format: int64 }
        creatorPayoutCents: { type: integer, format: int64, description: What the creator receives (price − creator fee). }

    OrderPayment:
      type: object
      required: [status, amountCents, refundedCents, method, methodLabel]
      properties:
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amountCents: { type: integer, format: int64 }
        refundedCents: { type: integer, format: int64, description: Refunds go back to the original payment method. }
        method: { $ref: '#/components/schemas/PaymentMethodType' }
        methodLabel: { type: string, examples: ['UPI · maya@okhdfc', 'Visa •••• 1111', 'HDFC Bank netbanking'] }

    Deadline:
      type: object
      required: [kind, at]
      properties:
        kind: { type: string, enum: [ACCEPT, DUE, REVIEW] }
        at: { type: string, format: date-time }

    OrderSummary:
      type: object
      required: [id, status, closeReason, kind, title, platform, counterparty, brand, creator, money, nextDeadline, late, needsAction, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        closeReason: { oneOf: [{ $ref: '#/components/schemas/CloseReason' }, { type: 'null' }] }
        kind: { $ref: '#/components/schemas/OrderKind' }
        title: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        counterparty: { $ref: '#/components/schemas/OrderParty' }
        brand: { $ref: '#/components/schemas/OrderParty' }
        creator: { $ref: '#/components/schemas/OrderParty' }
        money: { $ref: '#/components/schemas/OrderMoney' }
        nextDeadline: { oneOf: [{ $ref: '#/components/schemas/Deadline' }, { type: 'null' }] }
        late: { type: boolean, description: IN_PROGRESS past its due date. }
        needsAction: { type: boolean, description: The viewer has something to do now. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content, statusCounts, serverTime]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
            statusCounts:
              type: object
              description: The viewer's orders per status, for filter tabs.
              additionalProperties: { type: integer }
            serverTime: { type: string, format: date-time, description: Countdowns are computed from this, not the device clock. }

    DeliveryItem:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [FILE, POST_URL] }
        url: { type: string, description: 'FILE: a fileUrl from /files/presign. POST_URL: the live post (https).' }
        name: { type: [string, 'null'], maxLength: 200 }

    Delivery:
      type: object
      required: [id, revisionNo, items, note, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        revisionNo: { type: integer, description: 0 = first delivery, 1–2 = after revision requests. }
        items: { type: array, items: { $ref: '#/components/schemas/DeliveryItem' } }
        note: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }

    OrderEventView:
      type: object
      required: [type, fromStatus, toStatus, actor, note, at]
      properties:
        type: { type: string, enum: [CREATE, ACCEPT, DECLINE, CANCEL, EXPIRE, DELIVER, REQUEST_REVISION, APPROVE, AUTO_APPROVE, DISPUTE, ADMIN_RELEASE, ADMIN_REFUND] }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/OrderStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        actor: { type: string, enum: [BRAND, CREATOR, ADMIN, SYSTEM] }
        note: { type: [string, 'null'] }
        at: { type: string, format: date-time }

    DisputeView:
      type: object
      required: [reason, status, openedAt, resolution, refundCents]
      properties:
        reason: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        openedAt: { type: string, format: date-time }
        resolution: { type: [string, 'null'], enum: [RELEASE, FULL_REFUND, PARTIAL_REFUND, null] }
        refundCents: { type: [integer, 'null'] }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [packageId, campaignId, conversationId, deliverables, deliveryDays, payment, acceptBy, dueAt, reviewBy, revisionCount, maxRevisions, brief, deliveries, events, dispute, review, allowedActions, serverTime]
          properties:
            packageId: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: 'null' }] }
            campaignId: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: 'null' }] }
            conversationId: { $ref: '#/components/schemas/Ulid', description: The order's chat thread (FR-50). }
            deliverables: { type: array, items: { type: string }, description: What was bought (snapshot). }
            deliveryDays: { type: integer }
            payment: { $ref: '#/components/schemas/OrderPayment' }
            acceptBy: { type: string, format: date-time }
            dueAt: { type: [string, 'null'], format: date-time }
            reviewBy: { type: [string, 'null'], format: date-time }
            revisionCount: { type: integer }
            maxRevisions: { type: integer, examples: [2] }
            brief: { $ref: '#/components/schemas/OrderBrief' }
            deliveries: { type: array, description: Newest first., items: { $ref: '#/components/schemas/Delivery' } }
            events: { type: array, description: Oldest first (FR-52 timeline)., items: { $ref: '#/components/schemas/OrderEventView' } }
            dispute: { oneOf: [{ $ref: '#/components/schemas/DisputeView' }, { type: 'null' }] }
            review: { oneOf: [{ $ref: '#/components/schemas/Review' }, { type: 'null' }] }
            allowedActions: { type: array, items: { $ref: '#/components/schemas/OrderAction' } }
            serverTime: { type: string, format: date-time }

    ReasonRequest:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }

    NoteRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 10, maxLength: 2000 }

    DeliverRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/DeliveryItem' } }
        note: { type: [string, 'null'], maxLength: 1000 }

    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], maxLength: 1000 }

    ReplyRequest:
      type: object
      required: [reply]
      properties:
        reply: { type: string, minLength: 2, maxLength: 500 }

    # ---------- Auth ----------
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT, valid 15 minutes. }
        expiresIn: { type: integer, description: Seconds until the access token expires., examples: [900] }
        user: { $ref: '#/components/schemas/Me' }

    RegisterRequest:
      type: object
      required: [role, name, email, password, acceptTerms]
      properties:
        role: { $ref: '#/components/schemas/SignupRole' }
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least 8 characters with a letter and a number.
        acceptTerms: { type: boolean, const: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    GoogleAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, description: Google ID token from Google Identity Services. }
        role:
          $ref: '#/components/schemas/SignupRole'
          description: Required only when no account exists yet for this Google email.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
